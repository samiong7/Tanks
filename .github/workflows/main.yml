name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2 MinGW-w64 & SDL2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-SDL2
          mingw-w64-x86_64-SDL2_image
          mingw-w64-x86_64-SDL2_ttf
          mingw-w64-x86_64-SDL2_mixer

    - name: Compile Tanks.exe with GCC
      shell: msys2 {0}
      run: |
        # جمع كافة مسارات ملفات الهيدر والـ cpp
        INCLUDES=$(find src -type d | sed 's/^/-I/')
        SOURCES=$(find src -name "*.cpp")
        
        # بناء ملف Tanks.exe مباشرة بنفس مترجم المطور الأصلي
        g++ -std=c++17 -O2 -fpermissive $INCLUDES $SOURCES -o Tanks.exe \
          -lmingw32 -lSDL2main -lSDL2 -lSDL2_image -lSDL2_ttf -lSDL2_mixer -mwindows

    - name: Package Game & DLLs
      shell: msys2 {0}
      run: |
        mkdir -p Game_Release
        cp Tanks.exe Game_Release/
        
        # نسخ كافة ملفات الـ DLL المطلوبة لتعمل اللعبة على أي ويندوز
        ldd Tanks.exe | grep '/mingw64/bin/' | awk '{print $3}' | xargs -I {} cp {} Game_Release/
        
        # نسخ مجلدات الصور والخرائط والخطوط الخاصة باللعبة
        for dir in */; do
          dirname="${dir%/}"
          if [[ "$dirname" != "Game_Release" && "$dirname" != "src" && "$dirname" != ".git" && "$dirname" != ".github" ]]; then
            cp -r "$dirname" Game_Release/
          fi
        done
        cp *.png *.ttf *.txt Game_Release/ 2>/dev/null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tanks-Windows-EXE
        path: Game_Release/
