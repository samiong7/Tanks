name: Build Windows EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install SDL2 via vcpkg
      run: |
        vcpkg install sdl2:x64-windows sdl2-image:x64-windows sdl2-ttf:x64-windows sdl2-mixer:x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -A x64

    - name: Build EXE
      run: |
        cmake --build build --config Release

    - name: Package Game
      run: |
        mkdir Game_Release
        cp build/Release/*.exe Game_Release/
        cp build/Release/*.dll Game_Release/
        cp -r data Game_Release/ 2>$null || cp -r res Game_Release/ 2>$null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tanks-Windows-EXE
        path: Game_Release/
